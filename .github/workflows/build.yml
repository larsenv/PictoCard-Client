name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl bzip2 zip
      - name: Build mbedTLS
        run: ./scripts/build_portlibs.sh
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: make dist VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: PictoCard-3DS
          path: |
            dist/PictoCard-3DS.zip
            PictoCard.3dsx
      - name: Move the latest tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PictoCard for 3DS (latest)
          prerelease: false
          make_latest: true
          body: |
            Latest build of PictoCard for 3DS from ${{ github.sha }}.

            Extract PictoCard-3DS.zip to the root of your SD card and open PictoCard from the Homebrew Launcher.
          files: |
            dist/PictoCard-3DS.zip
            PictoCard.3dsx
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: PictoCard for 3DS ${{ steps.version.outputs.version }}
          make_latest: false
          files: |
            dist/PictoCard-3DS.zip
            PictoCard.3dsx
